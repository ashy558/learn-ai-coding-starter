services:
  sloperator-sandbox:
    build:
      context: .
      dockerfile: Dockerfile
    image: sloperator-sandbox:latest
    container_name: sloperator-sandbox
    environment:
      UV_LINK_MODE: copy
      GITHUB_TOKEN: ${GITHUB_TOKEN}
    volumes:
      - ~/.config/opencode:/root/.config/opencode:ro
    entrypoint:
      [
        "/bin/sh",
        "-c",
        "git clone https://github.com/ashy558/learn-ai-coding-starter.git && cd
        learn-ai-coding-starter && uv sync && opencode serve",
      ]
