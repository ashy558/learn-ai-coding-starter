services:
  sloperator-sandbox:
    build:
      context: .
      dockerfile: Dockerfile
    image: sloperator-sandbox:latest
    container_name: sloperator-sandbox
    environment:
      UV_LINK_MODE: copy
    volumes:
      - ./:/root/workspace
      - ~/.config/opencode:/root/.config/opencode:ro
      - sloperator-venv:/root/workspace/.venv
    entrypoint:
      ["/bin/sh", "-c", "cd /root/workspace && uv sync && opencode serve"]

volumes:
  sloperator-venv:
